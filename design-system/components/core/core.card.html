<style>
  body { margin: 0; padding: 24px; background: var(--bg-app); font-family: var(--font-sans); }

<body>
<div id="root"></div>
<script type="text/babel">
  const { Button, Input, Select, Checkbox, Badge, Tabs, Avatar, Card } = window.VenuePlusDesignSystem_17f1a7;

  function Demo() {
    return (
      <div>
        <div className="block">
          <p className="group-label">Buttons</p>
          <div className="row">

            <Button variant="accent">Book Now</Button>
            <Button variant="outline">Load More</Button>

            <Button variant="accent" loading>Booking</Button>

            <Button variant="primary" size="sm">Small</Button>
            <Button variant="primary" size="md">Medium</Button>
            <Button variant="primary" size="lg">Large</Button>

        </div>

            { value: 'security', label: 'Security', count: 3 },
            { value: 'catering', label: 'Catering' },

            <Checkbox label="Require security" defaultChecked />

            <Avatar name="Maya Cole" size="md" />
