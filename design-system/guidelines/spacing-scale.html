<!-- @dsCard group="Spacing" viewport="700x200" name="Spacing Scale" subtitle="4px base — the Tailwind step the app builds on." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
 body{margin:0;padding:24px;font-family:var(--font-sans);background:#fff;color:var(--neutral-700)}
 .r{display:flex;align-items:center;gap:14px;margin-bottom:7px}
 .r code{font-family:monospace;font-size:11px;color:var(--neutral-400);width:110px;flex-shrink:0}
 .bar{height:14px;background:var(--primary-500);border-radius:3px}
</style></head><body>
 <div class="r"><code>--space-1 · 4</code><div class="bar" style="width:4px"></div></div>
 <div class="r"><code>--space-2 · 8</code><div class="bar" style="width:8px"></div></div>
 <div class="r"><code>--space-3 · 12</code><div class="bar" style="width:12px"></div></div>
 <div class="r"><code>--space-4 · 16</code><div class="bar" style="width:16px"></div></div>
 <div class="r"><code>--space-5 · 20</code><div class="bar" style="width:20px"></div></div>
 <div class="r"><code>--space-6 · 24</code><div class="bar" style="width:24px"></div></div>
 <div class="r"><code>--space-8 · 32</code><div class="bar" style="width:32px"></div></div>
 <div class="r"><code>--space-12 · 48</code><div class="bar" style="width:48px"></div></div>
 <div class="r"><code>--space-16 · 64</code><div class="bar" style="width:64px"></div></div>
</body></html>
