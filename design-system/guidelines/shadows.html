<!-- @dsCard group="Spacing" viewport="700x170" name="Shadows" subtitle="Soft, neutral elevation. Cards rest at sm, lift to md." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
 body{margin:0;padding:32px 24px;font-family:var(--font-sans);background:var(--neutral-50);display:flex;gap:26px;align-items:center;flex-wrap:wrap}
 .b{display:flex;flex-direction:column;align-items:center;gap:10px}
 .card{width:96px;height:64px;background:#fff;border-radius:var(--radius-lg)}
 .b span{font-size:11px;color:var(--neutral-500);font-family:monospace}
</style></head><body>
 <div class="b"><div class="card" style="box-shadow:var(--shadow-sm)"></div><span>sm · rest</span></div>
 <div class="b"><div class="card" style="box-shadow:var(--shadow-md)"></div><span>md · hover</span></div>
 <div class="b"><div class="card" style="box-shadow:var(--shadow-lg)"></div><span>lg</span></div>
 <div class="b"><div class="card" style="box-shadow:var(--shadow-xl)"></div><span>xl · panel</span></div>
 <div class="b"><div class="card" style="box-shadow:var(--shadow-2xl)"></div><span>2xl · search</span></div>
</body></html>
