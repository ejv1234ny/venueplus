<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
 body{margin:0;padding:24px;font-family:var(--font-sans);background:#fff;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
 .b{font-size:13px;font-weight:600;padding:5px 12px;border-radius:var(--radius-full);text-transform:capitalize}
</style></head><body>
 <span class="b" style="background:var(--status-pending-bg);color:var(--status-pending-fg)">pending</span>
 <span class="b" style="background:var(--status-success-bg);color:var(--status-success-fg)">confirmed</span>
 <span class="b" style="background:var(--status-info-bg);color:var(--status-info-fg)">completed</span>
 <span class="b" style="background:var(--status-error-bg);color:var(--status-error-fg)">cancelled</span>
</body></html>
