<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
 body{margin:0;padding:20px;font-family:var(--font-sans);background:#fff;display:flex;gap:0}
 .sw{flex:1;height:96px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;box-sizing:border-box}
 .sw span{font-size:10px;font-weight:600}
 .sw small{font-size:9px;opacity:.7;font-family:monospace}
 .lite{color:var(--neutral-700)} .dark{color:#fff}
</style></head><body>
 <div class="sw lite" style="background:var(--accent-50)"><span>50</span><small>#fff0ed</small></div>
 <div class="sw lite" style="background:var(--accent-100)"><span>100</span></div>
 <div class="sw lite" style="background:var(--accent-200)"><span>200</span></div>
 <div class="sw lite" style="background:var(--accent-300)"><span>300</span></div>
 <div class="sw dark" style="background:var(--accent-400)"><span>400</span></div>
 <div class="sw dark" style="background:var(--accent-500)"><span>500</span><small>#ff6946</small></div>
 <div class="sw dark" style="background:var(--accent-600)"><span>600</span></div>
 <div class="sw dark" style="background:var(--accent-700)"><span>700</span></div>
 <div class="sw dark" style="background:var(--accent-800)"><span>800</span></div>
 <div class="sw dark" style="background:var(--accent-900)"><span>900</span></div>
</body></html>
