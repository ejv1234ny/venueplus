<!-- @dsCard group="Type" viewport="700x300" name="Type Scale" subtitle="Inter — hero 60px down to 12px meta." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
 body{margin:0;padding:24px;font-family:var(--font-sans);background:#fff;color:var(--neutral-900)}
 .r{display:flex;align-items:baseline;gap:16px;padding:5px 0;border-bottom:1px solid var(--neutral-100)}
 .r small{font-family:monospace;font-size:11px;color:var(--neutral-400);width:120px;flex-shrink:0}
</style></head><body>
 <div class="r"><small>6xl · 60 · 700</small><span style="font-size:var(--text-6xl);font-weight:700;line-height:1.1">Hero headline</span></div>
 <div class="r"><small>4xl · 36 · 700</small><span style="font-size:var(--text-4xl);font-weight:700">Page title</span></div>
 <div class="r"><small>3xl · 30 · 700</small><span style="font-size:var(--text-3xl);font-weight:700">Section title</span></div>
 <div class="r"><small>2xl · 24 · 700</small><span style="font-size:var(--text-2xl);font-weight:700">Panel heading</span></div>
 <div class="r"><small>lg · 18 · 600</small><span style="font-size:var(--text-lg);font-weight:600">Card title</span></div>
 <div class="r"><small>base · 16 · 400</small><span style="font-size:var(--text-base)">Body copy — the default reading size.</span></div>
 <div class="r"><small>sm · 14 · 400</small><span style="font-size:var(--text-sm);color:var(--neutral-500)">Secondary / meta text</span></div>
 <div class="r"><small>xs · 12 · 600</small><span style="font-size:var(--text-xs);font-weight:600;color:var(--neutral-500)">BADGE / LABEL</span></div>
</body></html>
