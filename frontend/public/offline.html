<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline · VenuePlus</title>
  <style>
    html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#f7f9fb;color:#1f2937}
    .wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem}
    img{width:72px;height:72px;margin-bottom:1rem}
    h1{font-size:1.4rem;margin:.25rem 0}
    p{color:#6b7280;max-width:28rem}
    button{margin-top:1.25rem;background:#007db1;color:#fff;border:0;border-radius:.5rem;padding:.7rem 1.4rem;font-size:1rem;font-weight:600;cursor:pointer}
  </style>
</head>
<body>
  <div class="wrap">
    <img src="/icon-192.png" alt="VenuePlus" />
    <h1>You're offline</h1>
    <p>VenuePlus needs an internet connection to browse venues and services. Check your connection and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
